# =============================================================================
# Cloudflare Tunnel - Kubernetes Deployment
# =============================================================================
# This manifest deploys the cloudflared tunnel daemon as a Kubernetes
# Deployment inside the EKS cluster. It creates an outbound-only encrypted
# connection to Cloudflare edge - no inbound ports are opened anywhere.
#
# In production:
#   - The tunnel credentials are stored as a Kubernetes secret
#   - The deployment runs 2 replicas for high availability
#   - The service routes traffic from the tunnel to the banking API pods
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: zero-trust
  labels:
    name: zero-trust
    environment: production

---
# Tunnel credentials stored as a Kubernetes secret
# In production: populated via: kubectl create secret generic tunnel-credentials
# --from-file=credentials.json=$HOME/.cloudflared/<TUNNEL_ID>.json
apiVersion: v1
kind: Secret
metadata:
  name: tunnel-credentials
  namespace: zero-trust
type: Opaque
data:
  credentials.json: <BASE64_ENCODED_TUNNEL_CREDENTIALS>

---
# ConfigMap containing the tunnel configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: zero-trust
data:
  config.yaml: |
    tunnel: 7c95c5c5-982d-4c56-a3f5-0e7c62550e30
    credentials-file: /etc/cloudflared/credentials.json
    ingress:
      - hostname: banking-api.skybound02.online
        service: http://banking-api-service.banking.svc.cluster.local:8080
      - service: http_status:404

---
# Cloudflared tunnel deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: zero-trust
  labels:
    app: cloudflared
    component: zero-trust-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
        component: zero-trust-tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "128Mi"
              cpu:    "100m"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: tunnel-credentials

---
# Banking API service - internal Kubernetes service
# The tunnel routes external traffic to this service
apiVersion: v1
kind: Service
metadata:
  name: banking-api-service
  namespace: banking
  labels:
    app: banking-api
spec:
  selector:
    app: banking-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP